name: VASH Light Jobs

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      vash_ref:
        required: false
        type: string
        default: main

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mazharr-hussain/vash-framework
          ref: ${{ inputs.vash_ref }}
          path: .vash
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install VASH
        run: pip install ./.vash
      - name: Run Command
        env:
          CMD: ${{ inputs.command }}
        run: bash -c "$CMD"
