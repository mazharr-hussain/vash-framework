name: VASH 3.0 Project Setup (run once)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Create/update GitHub Project with activities
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python .github/scripts/setup_project.py

  sync-statuses:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sync activity statuses to Project
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python .github/scripts/sync_statuses.py
