name: VASH 3.0 Sync Project Statuses

on:
  workflow_dispatch:
  push:
    paths:
      - 'runtime/validation/**.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sync activity statuses to GitHub Project
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python .github/scripts/sync_statuses.py
