name: VASH 3.0 Human Notification

on:
  push:
    branches: [main]
    paths:
      - 'audit/validation/**_summary.md'

jobs:
  notify-human:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Find new summary files
        id: find
        run: |
          NEW=$(git diff --name-only -M --diff-filter=A HEAD~1 HEAD | grep 'audit/validation/.*_summary\.md' | head -1)
          echo "summary_file=$NEW" >> $GITHUB_OUTPUT
          TASK_ID=$(echo "$NEW" | grep -oP '[0-9]+-[0-9]+' | head -1 | tr '-' '.')
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "Found: $NEW | Task: $TASK_ID"

      - name: Read summary content
        id: summary
        if: steps.find.outputs.summary_file != ''
        run: |
          CONTENT=$(cat "${{ steps.find.outputs.summary_file }}" 2>/dev/null || echo "Summary not found")
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub notification issue
        if: steps.find.outputs.summary_file != ''
        uses: actions/github-script@v8
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          script: |
            const taskId = '${{ steps.find.outputs.task_id }}';
            const summary = `${{ steps.summary.outputs.content }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `VASH Review Required: Activity ${taskId}`,
              body: `${summary}\n\n---\n*Go to P1 chat and type: APPROVED ${taskId} or MODIFY ${taskId} [corrections]*`,
              labels: ['vash-review']
            });

      - name: Call Routine API (if token available)
        if: steps.find.outputs.summary_file != '' && env.ROUTINE_TOKEN != ''
        env:
          ROUTINE_TOKEN: ${{ secrets.VASH_ROUTINE_TOKEN }}
          TASK_ID: ${{ steps.find.outputs.task_id }}
          SUMMARY_PATH: ${{ steps.find.outputs.summary_file }}
        run: |
          curl -s -X POST "https://api.anthropic.com/v1/claude_code/routines/trig_015p3ToHsccPETnkHVWQiAf3/fire" \
            -H "Authorization: Bearer ${ROUTINE_TOKEN}" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"TASK_ID: ${TASK_ID}\nSUMMARY_PATH: ${SUMMARY_PATH}\"}" \
            || echo "Routine call skipped — token not configured"
