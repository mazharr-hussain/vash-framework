name: Release

# Three tracks:
#   live  a tag vX.Y.Z equal to the version in pyproject.toml         -> a full release (the default install)
#   test  a tag vX.Y.Z-rc.N for the version in pyproject.toml        -> a pre-release (`--channel test`)
#   dev   main itself, no tag                                         -> `--channel dev`
# Create the tag on main, or create the release on github.com with a new tag (tick "Set as a pre-release" for a
# test version). This workflow checks the tag, tests, builds and publishes.

on:
  push:
    tags: [ 'v*.*.*' ]  # also matches test tags such as v3.2.0-rc.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: The tag must match pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" = "v$version" ]; then
            echo "Live release $TAG"
          elif [[ "$TAG" =~ ^v${version//./\\.}-rc\.[0-9]+$ ]]; then
            echo "Test release (pre-release) $TAG"
          else
            echo "::error::Tag $TAG must be v$version (live) or v$version-rc.N (test), matching pyproject.toml"
            exit 1
          fi
      - name: Tag must be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: Test
        run: |
          pip install -e .[dev]
          pytest -q
      - name: Build
        run: python -m build
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Created on github.com first? Then add the build to it; otherwise create the release.
          test_flag=""
          case "$TAG" in *-rc.*) test_flag="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            # A test tag is always a pre-release, even if it was created on github.com without the tick.
            [ -z "$test_flag" ] || gh release edit "$TAG" --prerelease
          else
            gh release create "$TAG" dist/* --title "VASH $TAG" --generate-notes --verify-tag $test_flag
          fi
