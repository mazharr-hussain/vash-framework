name: Release

# Publishing a live version: push a tag such as v3.1.0 on main (git tag v3.1.0 && git push origin v3.1.0),
# or create the release on github.com with a new tag. The tag must equal the version in pyproject.toml.
# The bootstrap installs the newest release by default; `--channel dev` installs main instead.

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: The tag must match pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi
      - name: Tag must be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: Test
        run: |
          pip install -e .[dev]
          pytest -q
      - name: Build
        run: python -m build
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Created on github.com first? Then add the build to it; otherwise create the release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "VASH $TAG" --generate-notes --verify-tag
          fi
