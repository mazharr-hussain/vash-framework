name: VASH 3.0 AvA Pipeline

on:
  issues:
    types: [labeled]

jobs:
  run-ava:
    if: contains(github.event.label.name, 'vash-activity')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Authenticate Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "Claude Code authenticated via OAuth token"

      - name: Extract activity ID from issue
        id: extract
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          TASK_ID=$(echo "$ISSUE_TITLE" | grep -oP 'Activity \K[0-9]+\.[0-9]+')
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "Task ID: $TASK_ID"

      - name: Run AvA orchestrator
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
        run: python .github/scripts/ava.py

      - name: Commit runtime artifacts
        run: |
          git config user.name "VASH-3.0-AvA"
          git config user.email "vash3@framework.ai"
          git add runtime/ knowledge/activity_list.md
          git diff --staged --quiet || git commit -m "AvA: Task ${{ steps.extract.outputs.task_id }} | $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Comment result on issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const taskId = '${{ steps.extract.outputs.task_id }}'.replace('.', '-');
            const summaryPath = `runtime/validation/${taskId}_summary.md`;
            let summary = 'Validation complete. Check runtime/validation/ for results.';
            try { summary = fs.readFileSync(summaryPath, 'utf8'); } catch(e) {}
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });
