name: VASH 3.0 AvA Pipeline

on:
  push:
    paths:
      - 'runtime/triggers/**.md'

jobs:
  detect-triggers:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect changed trigger files
        id: detect
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep 'runtime/triggers/.*_trigger\.md' || true)
          echo "Changed files: $FILES"
          JSON="["
          FIRST=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            TID=$(basename "$f" | sed 's/_trigger\.md//' | sed 's/^test_//' | tr '-' '.')
            [ -z "$TID" ] && continue
            $FIRST || JSON="$JSON,"
            JSON="$JSON{\"task_id\":\"$TID\",\"trigger_file\":\"$f\"}"
            FIRST=false
          done <<< "$FILES"
          JSON="$JSON]"
          echo "matrix={\"include\":$JSON}" >> $GITHUB_OUTPUT
          echo "Matrix: {\"include\":$JSON}"

  run-ava:
    needs: detect-triggers
    if: ${{ needs.detect-triggers.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-triggers.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Read activity and build prompts
        id: prompts
        env:
          TASK_ID: ${{ matrix.task_id }}
        run: python .github/scripts/build_prompts.py

      - name: Run Junior — Generate artifact
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompts.outputs.junior_prompt }}
          allowed_tools: "Read,Write,Bash"

      - name: Run Senior — Validate artifact
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompts.outputs.senior_prompt }}
          allowed_tools: "Read,Write"

      - name: Parse result and write summary
        id: result
        env:
          TASK_ID: ${{ matrix.task_id }}
        run: python .github/scripts/parse_result.py

      - name: Commit results
        run: |
          git config user.name "VASH-3.0-AvA"
          git config user.email "vash3@framework.ai"
          git pull --rebase origin main || true
          git add runtime/ knowledge/activity_list.md
          git diff --staged --quiet || git commit -m "AvA: Task ${{ matrix.task_id }} | $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Create notification issue
        uses: actions/github-script@v8
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          script: |
            const fs = require('fs');
            const taskId = '${{ matrix.task_id }}'.replace('.', '-');
            const summaryPath = `runtime/validation/${taskId}_summary.md`;
            let summary = 'Validation complete.';
            try { summary = fs.readFileSync(summaryPath, 'utf8'); } catch(e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `VASH Review: Activity ${{ matrix.task_id }}`,
              body: summary,
              labels: ['vash-review']
            });
