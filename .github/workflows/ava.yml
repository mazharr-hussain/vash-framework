name: VASH 3.0 AvA Pipeline

on:
  push:
    paths:
      - 'runtime/triggers/**.md'

jobs:
  detect-triggers:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect changed trigger files
        id: detect
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD | grep 'runtime/triggers/.*_trigger\.md' || true)
          echo "Changed trigger files:"
          echo "$FILES"
          # Build JSON matrix
          JSON="["
          FIRST=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Extract task ID from filename e.g. 3-1_trigger.md -> 3.1
            TID=$(basename "$f" | sed 's/_trigger\.md//' | tr '-' '.')
            [ -z "$TID" ] && continue
            $FIRST || JSON="$JSON,"
            JSON="$JSON{\"task_id\":\"$TID\",\"trigger_file\":\"$f\"}"
            FIRST=false
          done <<< "$FILES"
          JSON="$JSON]"
          echo "matrix={\"include\":$JSON}" >> $GITHUB_OUTPUT
          echo "Matrix: {\"include\":$JSON}"

  run-ava:
    needs: detect-triggers
    if: ${{ needs.detect-triggers.outputs.matrix != '{"include":[]}' && needs.detect-triggers.outputs.matrix != '{"include":[{"task_id":"","trigger_file":""}]}' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-triggers.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show task being processed
        run: |
          echo "Processing Task ID: ${{ matrix.task_id }}"
          echo "Trigger file: ${{ matrix.trigger_file }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run AvA orchestrator
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TASK_ID: ${{ matrix.task_id }}
        run: python .github/scripts/ava.py

      - name: Commit runtime artifacts
        run: |
          git config user.name "VASH-3.0-AvA"
          git config user.email "vash3@framework.ai"
          git pull --rebase origin main || true
          git add runtime/ knowledge/activity_list.md
          git diff --staged --quiet || git commit -m "AvA: Task ${{ matrix.task_id }} | $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Create notification issue
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const taskId = '${{ matrix.task_id }}'.replace('.', '-');
            const summaryPath = `runtime/validation/${taskId}_summary.md`;
            let summary = 'Validation complete. Check runtime/validation/ for results.';
            try { summary = fs.readFileSync(summaryPath, 'utf8'); } catch(e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `VASH Review: Activity ${{ matrix.task_id }}`,
              body: summary,
              labels: ['vash-review']
            });
