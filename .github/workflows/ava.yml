name: VASH 3.0 AvA Pipeline

on:
  push:
    paths:
      - 'runtime/triggers/**.md'

jobs:
  run-ava:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract task ID from trigger file
        id: extract
        run: |
          TRIGGER=$(git diff --name-only HEAD~1 HEAD | grep 'runtime/triggers/' | head -1)
          echo "Trigger file: $TRIGGER"
          TASK_ID=$(grep -oP 'TASK_ID:\s*\K[0-9]+\.[0-9]+' "$TRIGGER" 2>/dev/null || echo "")
          if [ -z "$TASK_ID" ]; then
            TASK_ID=$(basename "$TRIGGER" | grep -oP '[0-9]+-[0-9]+' | head -1 | tr '-' '.')
          fi
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "Task ID: $TASK_ID"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run AvA orchestrator
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
        run: python .github/scripts/ava.py

      - name: Commit runtime artifacts
        run: |
          git config user.name "VASH-3.0-AvA"
          git config user.email "vash3@framework.ai"
          git add runtime/ knowledge/activity_list.md
          git diff --staged --quiet || git commit -m "AvA: Task ${{ steps.extract.outputs.task_id }} | $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Create notification issue
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const taskId = '${{ steps.extract.outputs.task_id }}'.replace('.', '-');
            const summaryPath = `runtime/validation/${taskId}_summary.md`;
            let summary = 'Validation complete. Check runtime/validation/ for results.';
            try { summary = fs.readFileSync(summaryPath, 'utf8'); } catch(e) {}
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `VASH Review Required: Activity ${{ steps.extract.outputs.task_id }}`,
              body: summary,
              labels: ['vash-review']
            });
