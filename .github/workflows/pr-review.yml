name: PR review

# Every pull request is reviewed in two layers (rule R3: deterministic first).
#   1. Checks without AI: they decide pass or fail and can block the merge.
#   2. AI reviewer(s): they run only after layer 1 passed and each posts one comment.
# Everything runs in GitHub Actions; outside services are only called from here.
# Tests, Gate 1, Stage 0 and the terraform plan checks run in ci.yml.

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Checks without AI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install VASH and the review tools (pinned)
        run: |
          pip install -e .
          pip install -r .github/review-tools.txt
      - name: Lint (ruff) - bugs and dead code
        run: ruff check src tests
      - name: Security lint (bandit) - high severity blocks
        run: bandit -q -r src -lll
      - name: Known vulnerabilities in dependencies (pip-audit)
        run: pip-audit .
      - name: Secrets (detect-secrets) - anything not in the reviewed baseline blocks
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Workflow files (actionlint)
        run: actionlint -shellcheck= -pyflakes=

  dependency-review:
    name: New dependencies (GitHub dependency review)
    # Needs the repository setting "Dependency graph" to be on (Settings, Code security).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  ai-review:
    name: AI review (${{ matrix.name }})
    needs: static-checks
    # One entry per reviewer; each posts and updates its own comment. Add a second vendor as a new entry.
    #   gemini: Google Gemini, when the GEMINI_API_KEY secret is set; skipped without it.
    # (GitHub Models was tried: its endpoint now answers every request with a plain "OK".)
    # Pull requests from forks get no secrets and a read-only token; the step then skips or cannot comment.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gemini
            vendor: google
            base_url: https://generativelanguage.googleapis.com/v1beta/openai
            model: gemini-2.5-flash
            key_env: GEMINI_API_KEY
            max_diff_chars: '120000'
            headers: '{}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install VASH
        run: pip install -e .
      - name: Review the diff and post one comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VASH_REVIEW_NAME: ${{ matrix.name }}
          VASH_REVIEW_VENDOR: ${{ matrix.vendor }}
          VASH_REVIEW_BASE_URL: ${{ matrix.base_url }}
          VASH_REVIEW_MODEL: ${{ matrix.model }}
          VASH_REVIEW_KEY_ENV: ${{ matrix.key_env }}
          VASH_REVIEW_MAX_DIFF_CHARS: ${{ matrix.max_diff_chars }}
          VASH_REVIEW_HEADERS: ${{ matrix.headers }}
          # Repository variable, e.g. "blocker": such a finding then fails the check. Empty = advisory.
          VASH_REVIEW_FAIL_ON: ${{ vars.VASH_REVIEW_FAIL_ON }}
        run: python -m vash.adapters.forge.github.pr_review
