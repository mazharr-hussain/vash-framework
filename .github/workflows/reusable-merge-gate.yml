name: VASH Merge Gate

on:
  workflow_call:
    inputs:
      approval_label:
        required: false
        type: string
        default: approved

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mazharr-hussain/vash-framework
          path: .vash
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install VASH
        run: pip install ./.vash
      - name: Check Label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          REQ_LABEL: ${{ inputs.approval_label }}
        run: |
          if [[ ",$LABELS," != *",$REQ_LABEL,"* ]]; then
            echo "Missing required label: $REQ_LABEL"
            exit 1
          fi
      - name: Check ADRs
        run: python -m vash.tools.check_stack --repo .
