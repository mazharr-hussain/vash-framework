[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vash"
version = "3.0.0"
description = "VASH - Virtual AI Software House Engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Mazhar Hussain"}
]
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "skills-ref>=0.1.1,<0.2"]
skills = ["skills-ref>=0.1.1,<0.2"]

[project.scripts]
vash = "vash.cli.main:cli"

[project.urls]
Repository = "https://github.com/mazharr-hussain/vash-framework"
Issues = "https://github.com/mazharr-hussain/vash-framework/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Errors that are bugs or dead code. Style rules are added step by step (see .github/workflows/pr-review.yml).
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # adapters re-export Adapter for the registry
